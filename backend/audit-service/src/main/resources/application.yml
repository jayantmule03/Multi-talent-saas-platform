server:
  port: 8085

spring:
  application:
    name: audit-service

  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:audit_db}
      authentication-database: ${MONGO_AUTH_DB:admin}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service-group

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyInProductionEnvironmentPlease123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.multitalent: INFO
