
services:

  mysql:
    image: mysql:8.0
    container_name: mt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: mt_admin
      MYSQL_PASSWORD: mt_admin_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:7.0
    container_name: mt-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: audit_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Updated healthcheck to authenticate as the root user
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "admin", "-p", "admin_password", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: mt-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s



  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mt-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      # Switched to cub zk-ready, which is pre-installed on Confluent images and avoids missing 'nc' errors
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mt-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s



  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    container_name: mt-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: auth_db
      MYSQL_USER: mt_admin
      MYSQL_PASSWORD: mt_admin_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: LocalDevSecretKeyChangeInProduction123456789
      JWT_EXPIRATION_MS: 86400000
      TENANT_SERVICE_URL: http://tenant-service:8082
    ports:
      - "8081:8081"

  tenant-service:
    build:
      context: .
      dockerfile: backend/tenant-service/Dockerfile
    container_name: mt-tenant-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: tenant_db
      MYSQL_USER: mt_admin
      MYSQL_PASSWORD: mt_admin_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: LocalDevSecretKeyChangeInProduction123456789
    ports:
      - "8082:8082"

  project-service:
    build:
      context: .
      dockerfile: backend/project-service/Dockerfile
    container_name: mt-project-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: project_db
      MYSQL_USER: mt_admin
      MYSQL_PASSWORD: mt_admin_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: LocalDevSecretKeyChangeInProduction123456789
    ports:
      - "8083:8083"

  email-service:
    build:
      context: .
      dockerfile: backend/email-service/Dockerfile
    container_name: mt-email-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      # If your email client crashes on startup due to missing creds, fill these in
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    ports:
      - "8084:8084"

  audit-service:
    build:
      context: .
      dockerfile: backend/audit-service/Dockerfile
    container_name: mt-audit-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: audit_db
      MONGO_AUTH_DB: admin
      # Added matching credentials for the mongodb container
      MONGO_USER: admin
      MONGO_PASSWORD: admin_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: LocalDevSecretKeyChangeInProduction123456789
    ports:
      - "8085:8085"

  analytics-service:
    build:
      context: .
      dockerfile: backend/analytics-service/Dockerfile
    container_name: mt-analytics-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: LocalDevSecretKeyChangeInProduction123456789
    ports:
      - "8086:8086"



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mt-frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      tenant-service:
        condition: service_started
      project-service:
        condition: service_started
    ports:
      - "8888:80"


volumes:
  mysql-data:
  mongo-data:
  redis-data: