name: GitOps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "k8s/**"
      - "argocd/**"
      - ".github/workflows/gitops.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:


  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            jayantmule02/frontend:latest
            jayantmule02/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

 

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/auth-service/Dockerfile
          push: true
          tags: |
            jayantmule02/auth-service:latest
            jayantmule02/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    

      - name: Build and Push Tenant Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/tenant-service/Dockerfile
          push: true
          tags: |
            jayantmule02/tenant-service:latest
            jayantmule02/tenant-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

     

      - name: Build and Push Project Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/project-service/Dockerfile
          push: true
          tags: |
            jayantmule02/project-service:latest
            jayantmule02/project-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  

      - name: Build and Push Email Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/email-service/Dockerfile
          push: true
          tags: |
            jayantmule02/email-service:latest
            jayantmule02/email-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and Push Audit Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/audit-service/Dockerfile
          push: true
          tags: |
            jayantmule02/audit-service:latest
            jayantmule02/audit-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    

      - name: Build and Push Analytics Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/analytics-service/Dockerfile
          push: true
          tags: |
            jayantmule02/analytics-service:latest
            jayantmule02/analytics-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


 

  update-manifests:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Update Kubernetes images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |

          echo "========================================"
          echo "Updating Kubernetes images"
          echo "Image tag: ${IMAGE_TAG}"
          echo "========================================"

          # Auth
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/auth-service:${IMAGE_TAG}|" \
            k8s/auth.yml

          # Tenant
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/tenant-service:${IMAGE_TAG}|" \
            k8s/tenant.yml

          # Project
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/project-service:${IMAGE_TAG}|" \
            k8s/project.yml

          # Email
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/email-service:${IMAGE_TAG}|" \
            k8s/email.yml

          # Audit
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/audit-service:${IMAGE_TAG}|" \
            k8s/audit.yml

          # Analytics
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/analytics-service:${IMAGE_TAG}|" \
            k8s/analytics.yml

          # Frontend
          sed -i "s|^[[:space:]]*image:.*|          image: jayantmule02/frontend:${IMAGE_TAG}|" \
            k8s/frontend.yml



      - name: Verify Kubernetes images
        run: |

          echo "========================================"
          echo "Kubernetes images after update"
          echo "========================================"

          grep -R "image:" k8s/

          echo ""
          echo "========================================"
          echo "Git diff"
          echo "========================================"

          git diff -- k8s/


    

      - name: Commit Kubernetes changes
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
            exit 0
          fi

          git commit -m "chore: update images to ${IMAGE_TAG}"

          git push origin HEAD:main
