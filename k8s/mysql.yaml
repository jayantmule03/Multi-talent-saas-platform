apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: multi-talent-saas
data:
  01-grant-all-databases.sql: |
    -- See mysql-init/01-grant-all-databases.sql in the repo for context.
    GRANT ALL PRIVILEGES ON *.* TO 'mt_admin'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: multi-talent-saas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: multi-talent-saas
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: shared-secrets, key: MYSQL_ROOT_PASSWORD }
            # Initial database created on first boot; auth-service, tenant-service,
            # and project-service each createDatabaseIfNotExist their own DB
            # (auth_db/tenant_db/project_db) on connect, using this same admin user.
            - name: MYSQL_DATABASE
              value: "auth_db"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: shared-secrets, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: shared-secrets, key: MYSQL_PASSWORD }
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: multi-talent-saas
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
