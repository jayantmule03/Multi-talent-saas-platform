apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: multi-talent-saas
  labels:
    app: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          # Build from the project root: docker build -f email-service/Dockerfile -t <registry>/email-service:1.0.0 .
          image: multi-talent-saas-email-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: { name: shared-config }
            - secretRef: { name: shared-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: multi-talent-saas
spec:
  selector:
    app: email-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
