apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-talent-saas-ingress
  namespace: multi-talent-saas
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:

          - path: /api/auth
            pathType: Prefix
            backend:
              service: { name: auth-service, port: { number: 8081 } }
          - path: /api/tenants
            pathType: Prefix
            backend:
              service: { name: tenant-service, port: { number: 8082 } }
          - path: /api/projects
            pathType: Prefix
            backend:
              service: { name: project-service, port: { number: 8083 } }
          - path: /api/audit
            pathType: Prefix
            backend:
              service: { name: audit-service, port: { number: 8085 } }
          - path: /api/analytics
            pathType: Prefix
            backend:
              service: { name: analytics-service, port: { number: 8086 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend-service, port: { number: 80 } }
