<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Talent SaaS Platform — Sign In</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Multi-Talent SaaS Platform</h1>
    <p class="subtitle">Sign in to your workspace</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>

    <p class="form-footer">
      New here? <a href="register.html">Create an account</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const loginBtn = document.getElementById('loginBtn');

  function showAlert(message, type = 'error') {
    alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
      const data = await Api.login({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      Storage.setToken(data.token);
      Storage.setUser(data);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showAlert(err.message);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });

  // Redirect if already logged in
  if (Storage.getToken()) window.location.href = 'dashboard.html';
</script>
</body>
</html>
